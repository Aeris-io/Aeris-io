<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="Bahnschrift,'DIN Alternate','Helvetica Neue',Arial,sans-serif">
  <title>Aeris</title>
  <style>
    .s{fill:none;stroke:#1f2328;stroke-width:1.4;stroke-linecap:round;stroke-dasharray:70 130;animation:flow linear infinite}
    .a{stroke:#7c3aed}
    @keyframes flow{to{stroke-dashoffset:-200}}
    @media (prefers-reduced-motion:reduce){.s{animation:none}}
  </style>

  <!-- streamlines bending around the emblem -->
  <g>
    <path class="s a" style="stroke-opacity:.55;animation-duration:5.5s" d="M-20 170 L380 170 C470 170 480 78 600 78 S730 170 820 170 L1220 170"/>
    <path class="s a" style="stroke-opacity:.55;animation-duration:6s;animation-delay:-2s" d="M-20 210 L380 210 C470 210 480 302 600 302 S730 210 820 210 L1220 210"/>
    <path class="s" style="stroke-opacity:.38;animation-duration:6.5s;animation-delay:-1s" d="M-20 145 L380 145 C470 145 480 66 600 66 S730 145 820 145 L1220 145"/>
    <path class="s" style="stroke-opacity:.38;animation-duration:7s;animation-delay:-3s" d="M-20 235 L380 235 C470 235 480 314 600 314 S730 235 820 235 L1220 235"/>
    <path class="s" style="stroke-opacity:.28;animation-duration:7.5s;animation-delay:-4s" d="M-20 120 L380 120 C470 120 480 54 600 54 S730 120 820 120 L1220 120"/>
    <path class="s" style="stroke-opacity:.28;animation-duration:8s;animation-delay:-1.5s" d="M-20 260 L380 260 C470 260 480 326 600 326 S730 260 820 260 L1220 260"/>
    <path class="s" style="stroke-opacity:.2;animation-duration:8.5s;animation-delay:-5s" d="M-20 95 L380 95 C470 95 480 40 600 40 S730 95 820 95 L1220 95"/>
    <path class="s" style="stroke-opacity:.2;animation-duration:9s;animation-delay:-2.5s" d="M-20 285 L380 285 C470 285 480 340 600 340 S730 285 820 285 L1220 285"/>
    <path class="s" style="stroke-opacity:.12;animation-duration:9.5s;animation-delay:-6s" d="M-20 65 L380 65 C470 65 480 25 600 25 S730 65 820 65 L1220 65"/>
    <path class="s" style="stroke-opacity:.12;animation-duration:10s;animation-delay:-3.5s" d="M-20 315 L380 315 C470 315 480 355 600 355 S730 315 820 315 L1220 315"/>
  </g>

  <!-- emblem -->
  <g fill="#1f2328" transform="translate(456 37) scale(3)">
    <path d="M16 23 L46 37.4 L47 38.6 L47 80 L46.4 80 L41 69 L41 44.6 L24 35.6 L20 32 L17.6 28 Z"/>
    <path d="M24.2 38 L39 45.4 L39 53 L35.5 52.4 L30.5 49.4 L27.4 46 L25.2 41.6 Z"/>
    <path d="M80 23 L50 37.4 L49 38.6 L49 47 L55 44.6 L72 35.6 L76 32 L78.4 28 Z"/>
    <path d="M71.8 38 L49 49 L49 80 L49.6 80 L55 69 L55 55 L59 52.6 L63 50.2 L66 48 L68.2 45.6 L70 42.4 Z"/>
  </g>

  <text x="600" y="388" text-anchor="middle" fill="#1f2328" fill-opacity=".85" font-size="20" font-weight="300" letter-spacing="16">AERIS</text>
</svg>
