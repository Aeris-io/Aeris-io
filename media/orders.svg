<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
  <title>Standing orders</title>
  <defs><linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".08"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  <rect x="1" y="1" width="1198" height="378" rx="18" fill="#000"/>
  <rect x="1" y="1" width="1198" height="378" rx="18" fill="url(#sheen)" stroke="#fff" stroke-opacity=".14"/>
  <text x="48" y="58" fill="#fff" fill-opacity=".55" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15">{ Standing Orders }</text>
  <text x="46" y="104" fill="#fff" font-family="Fraunces,Georgia,'Times New Roman',serif" font-size="38" font-weight="600" letter-spacing="-1">Six principles we don't revisit</text>
  <line x1="48" y1="128" x2="1152" y2="128" stroke="#fff" stroke-opacity=".12"/>
  <text x="48" y="168" fill="#fff" fill-opacity=".45" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14">&#167;01</text>
  <text x="96" y="168" fill="#fff" font-family="Fraunces,Georgia,'Times New Roman',serif" font-size="24" font-weight="600">Custody</text>
  <text x="96" y="198" fill="#9a9a9a" font-family="Barlow,Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="300">Verifiable at every step.</text>
  <text x="424" y="168" fill="#fff" fill-opacity=".45" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14">&#167;02</text>
  <text x="472" y="168" fill="#fff" font-family="Fraunces,Georgia,'Times New Roman',serif" font-size="24" font-weight="600">Continuous sampling</text>
  <text x="472" y="198" fill="#9a9a9a" font-family="Barlow,Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="300">No snapshot passed off as live.</text>
  <text x="800" y="168" fill="#fff" fill-opacity=".45" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14">&#167;03</text>
  <text x="848" y="168" fill="#fff" font-family="Fraunces,Georgia,'Times New Roman',serif" font-size="24" font-weight="600">Latency discipline</text>
  <text x="848" y="198" fill="#9a9a9a" font-family="Barlow,Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="300">Timestamp and margin on everything.</text>
  <text x="48" y="272" fill="#fff" fill-opacity=".45" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14">&#167;04</text>
  <text x="96" y="272" fill="#fff" font-family="Fraunces,Georgia,'Times New Roman',serif" font-size="24" font-weight="600">Signal over noise</text>
  <text x="96" y="302" fill="#9a9a9a" font-family="Barlow,Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="300">An anomaly is reported once.</text>
  <text x="424" y="272" fill="#fff" fill-opacity=".45" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14">&#167;05</text>
  <text x="472" y="272" fill="#fff" font-family="Fraunces,Georgia,'Times New Roman',serif" font-size="24" font-weight="600">Bearing</text>
  <text x="472" y="302" fill="#9a9a9a" font-family="Barlow,Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="300">Direction and uncertainty, together.</text>
  <text x="800" y="272" fill="#fff" fill-opacity=".45" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14">&#167;06</text>
  <text x="848" y="272" fill="#fff" font-family="Fraunces,Georgia,'Times New Roman',serif" font-size="24" font-weight="600">Accountability</text>
  <text x="848" y="302" fill="#9a9a9a" font-family="Barlow,Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="300">Every reading traces to its sample.</text>
</svg>