<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" font-family="Bahnschrift,'DIN Alternate','Helvetica Neue',Arial,sans-serif">
  <title>Why Aeris exists</title>
  <rect x="1" y="1" width="1198" height="288" rx="18" fill="#0a0a0a" stroke="#ffffff" stroke-opacity=".16"/>

  <text x="48" y="60" fill="#ffffff" fill-opacity=".5" font-size="15" letter-spacing="5">WHY AERIS EXISTS</text>

  <!-- axis -->
  <line x1="56" y1="104" x2="1152" y2="104" stroke="#ffffff" stroke-opacity=".18"/>
  <line x1="56" y1="104" x2="1124" y2="104" stroke="#ffffff" stroke-opacity=".45" stroke-dasharray="2 6"/>

  <!-- 2023 -->
  <circle cx="56" cy="104" r="5" fill="#ffffff" fill-opacity=".55"/>
  <text x="48" y="146" fill="#ffffff" fill-opacity=".55" font-size="14" letter-spacing="4">2023</text>
  <g font-size="17">
    <text x="48" y="182" fill="#ffffff">The problem was never data.</text>
    <text x="48" y="206" fill="#ffffff" fill-opacity=".55">It was narration: every tool told</text>
    <text x="48" y="230" fill="#ffffff" fill-opacity=".55">a story before it showed a reading.</text>
  </g>

  <!-- 2024 -->
  <circle cx="332" cy="104" r="5" fill="#ffffff" fill-opacity=".55"/>
  <text x="324" y="146" fill="#ffffff" fill-opacity=".55" font-size="14" letter-spacing="4">2024</text>
  <g font-size="17" fill="#ffffff" fill-opacity=".55">
    <text x="324" y="182">Instruments first, charts later.</text>
    <text x="324" y="206">If a reading can't be trusted,</text>
    <text x="324" y="230">nothing downstream matters.</text>
  </g>

  <!-- 2025 -->
  <circle cx="608" cy="104" r="5" fill="#ffffff" fill-opacity=".55"/>
  <text x="600" y="146" fill="#ffffff" fill-opacity=".55" font-size="14" letter-spacing="4">2025</text>
  <g font-size="17" fill="#ffffff" fill-opacity=".55">
    <text x="600" y="182">Live for a small set of operators</text>
    <text x="600" y="206">who wanted raw conditions,</text>
    <text x="600" y="230">not curated dashboards.</text>
  </g>

  <!-- 2026 -->
  <circle cx="884" cy="104" r="12" fill="none" stroke="#ffffff" stroke-opacity=".4"/>
  <circle cx="884" cy="104" r="6" fill="#ffffff"/>
  <text x="876" y="146" fill="#ffffff" font-size="14" letter-spacing="4">2026 · NOW</text>
  <g font-size="17" fill="#ffffff" fill-opacity=".55">
    <text x="876" y="182">A continuous instrument, not a</text>
    <text x="876" y="206">report you check once a week</text>
    <text x="876" y="230">and forget.</text>
  </g>
</svg>
