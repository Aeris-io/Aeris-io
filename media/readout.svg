  <rect x="1" y="1" width="1198" height="158" rx="18" fill="#000"/>
  <rect x="1" y="1" width="1198" height="158" rx="18" fill="url(#sheen)" stroke="#fff" stroke-opacity=".14"/>
  
  <text x="48" y="102" fill="#fff" font-family="Barlow,Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="64" font-weight="300">05</text>
  <text x="148" y="74" fill="#fff" font-family="Barlow,Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400">Networks signed</text>
  <text x="148" y="100" fill="#9a9a9a" font-family="Barlow,Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="300">four mainnets, one testnet</text>
  <line x1='396' y1='34' x2='396' y2='126' stroke='#fff' stroke-opacity='.12'/>
  <text x="428" y="102" fill="#fff" font-family="Barlow,Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="64" font-weight="300">02</text>
