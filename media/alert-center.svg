<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" font-family="Bahnschrift,'DIN Alternate','Helvetica Neue',Arial,sans-serif">
  <title>Alert Center</title>
  <rect x="1" y="1" width="598" height="338" rx="18" fill="#0a0a0a" stroke="#ffffff" stroke-opacity=".16"/>
