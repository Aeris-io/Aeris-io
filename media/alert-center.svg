  </g>
  <line x1="284" y1="88" x2="284" y2="262" stroke="#ffffff" stroke-opacity=".12"/>
  <rect x='300' y='113' width='52' height='22' rx='4' fill='#ffffff'/><text x='326' y='128' text-anchor='middle' fill='#0a0a0a' font-size='11' letter-spacing='2'>HIGH</text><text x='364' y='128' fill='#ffffff' fill-opacity='.9' font-size='13.5'>CIP-17 · network upgrade</text>
  <rect x='300.5' y='151.5' width='51' height='21' rx='4' fill='none' stroke='#ffffff' stroke-opacity='.4'/><text x='326' y='166' text-anchor='middle' fill='#ffffff' fill-opacity='.7' font-size='11' letter-spacing='2'>MED</text><text x='364' y='166' fill='#ffffff' fill-opacity='.55' font-size='13.5'>Gov · recover IBC clients</text>
  <rect x='300.5' y='189.5' width='51' height='21' rx='4' fill='none' stroke='#ffffff' stroke-opacity='.4'/><text x='326' y='204' text-anchor='middle' fill='#ffffff' fill-opacity='.7' font-size='11' letter-spacing='2'>MED</text><text x='364' y='204' fill='#ffffff' fill-opacity='.55' font-size='13.5'>IBC · client healthy → expired</text>
  <rect x='300.5' y='227.5' width='51' height='21' rx='4' fill='none' stroke='#ffffff' stroke-opacity='.4'/><text x='326' y='242' text-anchor='middle' fill='#ffffff' fill-opacity='.7' font-size='11' letter-spacing='2'>LOW</text><text x='364' y='242' fill='#ffffff' fill-opacity='.55' font-size='13.5'>IBC · client expired → healthy</text>
  <line x1="32" y1="290" x2="568" y2="290" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="32" y="318" fill="#ffffff" fill-opacity=".55" font-size="14" letter-spacing="3">GOVERNANCE · CIP · RSS</text>
